name: Validate Collection Catalog

on:
  workflow_dispatch:
  push:
    paths:
      - "catalog/**"
      - "scripts/validate_catalog.py"
      - "scripts/generate_catalog_report.py"
      - ".github/workflows/catalog-update.yml"
  pull_request:
    paths:
      - "catalog/**"
      - "scripts/validate_catalog.py"
      - "scripts/generate_catalog_report.py"
      - ".github/workflows/catalog-update.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate catalog
        run: python scripts/validate_catalog.py catalog/v1/catalog.json --report metadata-update-report.md

      - name: Generate catalog report
        run: python scripts/generate_catalog_report.py catalog/v1/catalog.json --output metadata-update-report.md

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: metadata-update-report
          path: metadata-update-report.md
