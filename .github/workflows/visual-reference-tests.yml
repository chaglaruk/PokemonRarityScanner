name: Validate Pinned Visual Reference Tools

on:
  pull_request:
    paths:
      - "scripts/download_visual_reference_assets.py"
      - "scripts/test_download_visual_reference_assets.py"
      - "scripts/build_shiny_candidate_signatures.py"
      - "scripts/test_build_shiny_candidate_signatures.py"
      - ".github/workflows/visual-reference-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-asset-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install deterministic image tooling
        run: python3 -m pip install Pillow==11.3.0
      - name: Check Python syntax without network or asset downloads
        run: python3 -m compileall -q scripts/download_visual_reference_assets.py scripts/build_shiny_candidate_signatures.py scripts/test_download_visual_reference_assets.py scripts/test_build_shiny_candidate_signatures.py
      - name: Test whole-archive downloading and source validation offline
        run: python3 -B scripts/test_download_visual_reference_assets.py
      - name: Test all-species normal-Shiny candidate feature generation offline
        run: python3 -B scripts/test_build_shiny_candidate_signatures.py
