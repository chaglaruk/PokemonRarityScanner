name: Refresh Living Pokedex

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-living-pokedex.yml"
      - "scripts/**"
      - "metadata_manifest.json"
      - "app/src/main/assets/data/**"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-living-pokedex
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Install Python dependencies
        run: python -m pip install --upgrade pillow

      - name: Prepare external assets
        shell: bash
        run: |
          rm -rf external/pogo_assets
          git clone --depth 1 https://github.com/PokeMiners/pogo_assets.git external/pogo_assets

      - name: Download latest Game Master
        shell: bash
        run: |
          mkdir -p external/game_masters/latest
          python - <<'PY'
          import pathlib
          import urllib.request

          url = "https://raw.githubusercontent.com/PokeMiners/game_masters/master/latest/latest.json"
          out = pathlib.Path("external/game_masters/latest/latest.json")
          out.write_bytes(urllib.request.urlopen(url, timeout=120).read())
          print(f"Downloaded {out}")
          PY

      - name: Refresh event archive snapshot
        run: |
          python scripts/fetch_bulbapedia_event_pokemon.py --out scripts/external_snapshots/bulbapedia_event_pokemon_go.json
          cp scripts/external_snapshots/bulbapedia_event_pokemon_go.json app/src/main/assets/data/bulbapedia_event_pokemon_go.json

      - name: Extract Game Master costume and form keys
        run: |
          python scripts/extract_costume_keys_from_gm.py --gm external/game_masters/latest/latest.json --out scripts/costume_keys.json
          python scripts/extract_variant_forms_from_gm.py --gm external/game_masters/latest/latest.json --out scripts/game_master_variant_forms.json

      - name: Rebuild variant metadata
        run: |
          python scripts/generate_variant_catalog.py
          python scripts/generate_authoritative_variant_db.py
          python scripts/generate_costume_signatures.py --assets-dir "external/pogo_assets/Images/Pokemon - 256x256" --variant-registry "app/src/main/assets/data/variant_registry.json" --out "app/src/main/assets/data/costume_signatures.json"
          python scripts/generate_master_pokedex.py
          python scripts/generate_global_rarity_legacy_db.py

      - name: Refresh metadata manifest version and hashes
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          from datetime import datetime, timezone

          path = pathlib.Path("metadata_manifest.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          payload["version"] = datetime.now(timezone.utc).strftime("%Y-%m-%d-living-db")

          data_dir = pathlib.Path("app/src/main/assets/data")
          for name, file_spec in payload.get("files", {}).items():
              metadata_path = data_dir / name
              if not metadata_path.is_file():
                  raise FileNotFoundError(f"Manifest file not found: {metadata_path}")
              file_spec["sha256"] = hashlib.sha256(metadata_path.read_bytes()).hexdigest()

          path.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Updated {path}")
          PY

      - name: Detect substantive metadata changes
        id: changes
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          tracked_paths = [
              "metadata_manifest.json",
              "scripts/costume_keys.json",
              "scripts/game_master_variant_forms.json",
              "scripts/external_snapshots/bulbapedia_event_pokemon_go.json",
              "app/src/main/assets/data/bulbapedia_event_pokemon_go.json",
              "app/src/main/assets/data/variant_catalog.json",
              "app/src/main/assets/data/authoritative_variant_db.json",
              "app/src/main/assets/data/global_rarity_legacy_db.json",
              "app/src/main/assets/data/costume_signatures.json",
              "app/src/main/assets/data/master_pokedex.json",
          ]

          def normalize(value, *, manifest=False):
              if isinstance(value, dict):
                  normalized = {}
                  for key, child in value.items():
                      if key == "generatedAt":
                          continue
                      if manifest and key in {"version", "sha256"}:
                          continue
                      normalized[key] = normalize(child, manifest=manifest)
                  return normalized
              if isinstance(value, list):
                  return [normalize(item, manifest=manifest) for item in value]
              return value

          substantive_changes = []
          for raw_path in tracked_paths:
              path = pathlib.Path(raw_path)
              current = json.loads(path.read_text(encoding="utf-8"))
              try:
                  previous_text = subprocess.check_output(
                      ["git", "show", f"HEAD:{raw_path}"],
                      text=True,
                      encoding="utf-8",
                  )
              except subprocess.CalledProcessError:
                  substantive_changes.append(raw_path)
                  continue

              previous = json.loads(previous_text)
              is_manifest = raw_path == "metadata_manifest.json"
              if normalize(current, manifest=is_manifest) != normalize(previous, manifest=is_manifest):
                  substantive_changes.append(raw_path)

          output_path = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          if substantive_changes:
              print("Substantive metadata changes detected:")
              for changed_path in substantive_changes:
                  print(f"- {changed_path}")
              with output_path.open("a", encoding="utf-8") as output:
                  output.write("changed=true\n")
          else:
              print("Only volatile timestamps or derived manifest hashes changed; restoring tracked files.")
              subprocess.run(["git", "checkout", "--", *tracked_paths], check=True)
              with output_path.open("a", encoding="utf-8") as output:
                  output.write("changed=false\n")
          PY

      - name: Validate refreshed metadata diff
        if: steps.changes.outputs.changed == 'true'
        run: git diff --check

      - name: Run unit tests before metadata commit
        if: steps.changes.outputs.changed == 'true'
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Build debug APK before metadata commit
        if: steps.changes.outputs.changed == 'true'
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Commit refreshed metadata
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metadata_manifest.json scripts/costume_keys.json scripts/game_master_variant_forms.json scripts/external_snapshots/bulbapedia_event_pokemon_go.json app/src/main/assets/data/bulbapedia_event_pokemon_go.json app/src/main/assets/data/variant_catalog.json app/src/main/assets/data/authoritative_variant_db.json app/src/main/assets/data/global_rarity_legacy_db.json app/src/main/assets/data/costume_signatures.json app/src/main/assets/data/master_pokedex.json
          git commit -m "Refresh living pokedex metadata"
          git push

      - name: Report no-op refresh
        if: steps.changes.outputs.changed == 'false'
        run: echo "No substantive living metadata changes detected; no commit created."
