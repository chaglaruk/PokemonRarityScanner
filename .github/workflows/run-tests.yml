name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Generate detekt baseline
        run: ./gradlew :app:detektBaseline --no-daemon --console=plain

      - name: Commit generated detekt baseline
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/detekt/baseline.xml
          if git diff --cached --quiet; then
            echo "Detekt baseline is unchanged."
          else
            git commit -m "Add initial detekt baseline"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Upload detekt baseline
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: detekt-baseline
          path: config/detekt/baseline.xml
          if-no-files-found: error
          retention-days: 1

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-results
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 7

      - name: Run Android lint
        run: ./gradlew :app:lintDebug --no-daemon --console=plain

      - name: Upload Android lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-lint-results
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain
