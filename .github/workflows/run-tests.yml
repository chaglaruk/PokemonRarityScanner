name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      qaApplicationIdSuffix:
        description: Stable QA package suffix for Pixel validation
        required: false
        default: .sprint6qa.diag18

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate MobSF PowerShell launcher syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path "scripts/security/start_mobsf_local.ps1"),
              [ref]$tokens,
              [ref]$parseErrors
          ) | Out-Null

          if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object {
                  Write-Error ("{0}:{1}: {2}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message)
              }
              exit 1
          }

      - name: Test visual identity catalog generator
        run: python3 scripts/test_visual_identity_catalog.py

      - name: Validate checked-in visual identity catalog
        run: python3 scripts/build_visual_identity_catalog.py --check

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run detekt
        run: ./gradlew :app:detekt --no-daemon --console=plain

      - name: Upload detekt reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: detekt-results
          path: |
            app/build/reports/detekt/detekt.html
            app/build/reports/detekt/detekt.xml
            app/build/reports/detekt/detekt.md
            app/build/reports/detekt/detekt.sarif
          if-no-files-found: warn
          retention-days: 7

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-results
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 7

      - name: Run Android lint
        run: ./gradlew :app:lintDebug --no-daemon --console=plain

      - name: Upload Android lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-lint-results
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Validate isolated QA build and instrumentation packages
        env:
          QA_SOURCE_SHA: ${{ github.sha }}
          QA_APPLICATION_ID_SUFFIX: ${{ github.event_name == 'workflow_dispatch' && inputs.qaApplicationIdSuffix || '.sprint6qa.diag18' }}
        run: ./gradlew :app:testQaUnitTest --tests com.pokerarity.scanner.QaApplicationIdentityTest :app:assembleQa :app:assembleQaAndroidTest :app:lintAnalyzeQa -Pqa.sourceSha="$QA_SOURCE_SHA" -PqaApplicationIdSuffix="$QA_APPLICATION_ID_SUFFIX" --no-daemon --console=plain

      - name: Upload short-retention Pixel QA packages
        if: success() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scanner-visual-catalog-qa-${{ github.sha }}
          path: |
            app/build/outputs/apk/qa/*.apk
            app/build/outputs/apk/androidTest/qa/*.apk
          if-no-files-found: error
          retention-days: 3
