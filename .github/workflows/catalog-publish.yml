name: Publish Collection Catalog

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "catalog/v1/**"
      - ".github/workflows/catalog-publish.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate catalog
        run: python scripts/validate_catalog.py catalog/v1/catalog.json

      - name: Publish catalog to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./catalog/v1
          destination_dir: catalog/v1
          keep_files: true
