<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">Four evidence layers used by PokeRarityScanner</title>
<desc id="desc">Cards for OCR, visual evidence, event context and explainable scoring.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0A0E1D"/><stop offset="1" stop-color="#151A34"/></linearGradient>
  <linearGradient id="b1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0EA5E9" stop-opacity=".28"/><stop offset="1" stop-color="#0EA5E9" stop-opacity=".03"/></linearGradient>
  <linearGradient id="b2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8B5CF6" stop-opacity=".28"/><stop offset="1" stop-color="#8B5CF6" stop-opacity=".03"/></linearGradient>
  <linearGradient id="b3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10B981" stop-opacity=".25"/><stop offset="1" stop-color="#10B981" stop-opacity=".03"/></linearGradient>
  <linearGradient id="b4" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F97316" stop-opacity=".26"/><stop offset="1" stop-color="#F97316" stop-opacity=".03"/></linearGradient>
</defs>
<rect width="1600" height="520" rx="34" fill="url(#bg)"/>
<text x="70" y="72" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="900">WHAT THE SCANNER SEES</text>
<text x="70" y="108" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Each result is assembled from separate evidence layers — not a single lookup.</text>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <g transform="translate(70 150)"><rect width="345" height="305" rx="26" fill="url(#b1)" stroke="#38BDF8" stroke-opacity=".36"/><circle cx="58" cy="58" r="30" fill="#0EA5E9" fill-opacity=".18"/><path d="M44 42h28v21H44z M49 68h18 M52 50h12" fill="none" stroke="#7DD3FC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="120" fill="#F8FAFC" font-size="25" font-weight="900">01 · TEXT</text><text x="32" y="157" fill="#7DD3FC" font-size="18" font-weight="800">OCR + consistency gates</text><text x="32" y="200" fill="#CBD5E1" font-size="17">Species name</text><text x="32" y="229" fill="#CBD5E1" font-size="17">CP and HP</text><text x="32" y="258" fill="#CBD5E1" font-size="17">Caught date</text><text x="32" y="287" fill="#94A3B8" font-size="14">Fail-closed when evidence conflicts</text></g>
  <g transform="translate(438 150)"><rect width="345" height="305" rx="26" fill="url(#b2)" stroke="#A78BFA" stroke-opacity=".36"/><circle cx="58" cy="58" r="30" fill="#8B5CF6" fill-opacity=".18"/><path d="M38 58c10-16 30-16 40 0-10 16-30 16-40 0z M58 52a6 6 0 1 0 0 12 6 6 0 0 0 0-12z" fill="none" stroke="#C4B5FD" stroke-width="4"/><text x="32" y="120" fill="#F8FAFC" font-size="25" font-weight="900">02 · VISUALS</text><text x="32" y="157" fill="#C4B5FD" font-size="18" font-weight="800">Variant evidence</text><text x="32" y="200" fill="#CBD5E1" font-size="17">Shiny and shadow</text><text x="32" y="229" fill="#CBD5E1" font-size="17">Costume and form</text><text x="32" y="258" fill="#CBD5E1" font-size="17">Background and location card</text><text x="32" y="287" fill="#94A3B8" font-size="14">Species authority stays protected</text></g>
  <g transform="translate(806 150)"><rect width="345" height="305" rx="26" fill="url(#b3)" stroke="#34D399" stroke-opacity=".36"/><circle cx="58" cy="58" r="30" fill="#10B981" fill-opacity=".16"/><path d="M42 46h32v29H42z M48 40v12 M68 40v12 M42 56h32 M50 64h4 M62 64h4" fill="none" stroke="#6EE7B7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="120" fill="#F8FAFC" font-size="25" font-weight="900">03 · CONTEXT</text><text x="32" y="157" fill="#6EE7B7" font-size="18" font-weight="800">Historical event windows</text><text x="32" y="200" fill="#CBD5E1" font-size="17">Release dates</text><text x="32" y="229" fill="#CBD5E1" font-size="17">Repeated-costume handling</text><text x="32" y="258" fill="#CBD5E1" font-size="17">Date-backed event labels</text><text x="32" y="287" fill="#94A3B8" font-size="14">No date match, no named-event bonus</text></g>
  <g transform="translate(1174 150)"><rect width="356" height="305" rx="26" fill="url(#b4)" stroke="#FB923C" stroke-opacity=".38"/><circle cx="58" cy="58" r="30" fill="#F97316" fill-opacity=".16"/><path d="M40 72V60 M52 72V49 M64 72V40 M76 72V54" fill="none" stroke="#FDBA74" stroke-width="5" stroke-linecap="round"/><text x="32" y="120" fill="#F8FAFC" font-size="25" font-weight="900">04 · DECISION</text><text x="32" y="157" fill="#FDBA74" font-size="18" font-weight="800">Explainable 0–100 score</text><text x="32" y="200" fill="#CBD5E1" font-size="17">Base species axis</text><text x="32" y="229" fill="#CBD5E1" font-size="17">Variant and age axes</text><text x="32" y="258" fill="#CBD5E1" font-size="17">Collector context</text><text x="32" y="287" fill="#94A3B8" font-size="14">Always capped, always traceable</text></g>
</g>
</svg>