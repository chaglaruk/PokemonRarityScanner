    <path d="M64 157V138H83 M347 138H366V157 M64 313V332H83 M347 332H366V313" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
    <g font-family="Inter,Segoe UI,Arial,sans-serif"><rect x="64" y="303" width="136" height="35" rx="17.5" fill="#0EA5E9" opacity="0.88"/><text x="132" y="326" fill="#F0F9FF" text-anchor="middle" font-weight="800" font-size="14">SPECIES LOCKED</text></g>
    <rect x="44" y="382" width="342" height="190" rx="28" fill="#17162F" stroke="#8B5CF6" stroke-opacity="0.55"/>
    <g font-family="Inter,Segoe UI,Arial,sans-serif">
      <text x="70" y="420" fill="#94A3B8" font-size="14" letter-spacing="1.1">RESULT</text><text x="70" y="454" fill="#F8FAFC" font-weight="900" font-size="27">BULBASAUR</text><text x="70" y="479" fill="#94A3B8" font-size="15">CP 619 • caught 23 Oct 2018</text>
      <g transform="translate(70 496)"><rect width="70" height="28" rx="14" fill="#22C55E" opacity="0.17" stroke="#4ADE80"/><text x="35" y="19" text-anchor="middle" fill="#BBF7D0" font-size="12" font-weight="700">COSTUME</text><g transform="translate(80 0)"><rect width="82" height="28" rx="14" fill="#F59E0B" opacity="0.16" stroke="#FBBF24"/><text x="41" y="19" text-anchor="middle" fill="#FDE68A" font-size="12" font-weight="700">DATE OK</text></g></g>
      <text x="305" y="439" fill="#F8FAFC" text-anchor="middle" font-weight="900" font-size="44">72</text><text x="305" y="462" fill="#A78BFA" text-anchor="middle" font-weight="800" font-size="14">EPIC</text><rect x="70" y="542" width="285" height="9" rx="4.5" fill="#2A2E4A"/><rect x="70" y="542" width="205" height="9" rx="4.5" fill="url(#score)"/>
    </g>
