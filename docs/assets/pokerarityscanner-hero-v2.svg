  <g font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(920 150) rotate(-6)"><rect width="176" height="68" rx="16" fill="#0B1224" stroke="#38BDF8" stroke-opacity="0.55"/><text x="18" y="27" fill="#7DD3FC" font-weight="800" font-size="13">OCR CONFIDENCE</text><text x="18" y="51" fill="#F8FAFC" font-weight="900" font-size="21">0.94</text></g>
    <g transform="translate(1374 455) rotate(7)"><rect width="156" height="72" rx="16" fill="#0B1224" stroke="#F472B6" stroke-opacity="0.55"/><text x="18" y="29" fill="#F9A8D4" font-weight="800" font-size="13">EVENT MATCH</text><text x="18" y="53" fill="#F8FAFC" font-weight="900" font-size="17">DATE-BACKED</text></g>
