      <path d="M30 30 C35 -3 55 -15 72 12 C92 -2 106 20 82 43 C66 55 44 52 30 30Z" fill="#3B9D68"/>
      <path d="M19 70 L3 92 L30 82Z" fill="#75C98B"/><path d="M89 70 L108 92 L80 82Z" fill="#75C98B"/>
      <circle cx="38" cy="63" r="4" fill="#111827"/><circle cx="72" cy="63" r="4" fill="#111827"/>
      <path d="M48 78 Q55 83 62 78" fill="none" stroke="#166534" stroke-width="3" stroke-linecap="round"/>
