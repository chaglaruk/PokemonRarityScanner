  <text x="182" y="110" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" font-size="26" letter-spacing="1.4">POKE RARITY SCANNER</text>
  <text x="182" y="139" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" letter-spacing="2.7">ANDROID • OCR • COMPUTER VISION</text>
  <g transform="translate(100 214)">
    <text x="0" y="0" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="900" font-size="74">SEE THE SIGNALS.</text>
    <text x="0" y="82" fill="url(#accent)" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="900" font-size="74">EXPLAIN THE RARITY.</text>
    <text x="2" y="145" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25">Turns a Pokémon GO detail screen into a capped 0–100 score,</text>
    <text x="2" y="181" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25">evidence labels and a date-aware collector explanation.</text>
    <g transform="translate(0 226)" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" font-size="16">
