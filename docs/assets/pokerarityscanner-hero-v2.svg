      <g transform="translate(132 0)"><rect width="112" height="42" rx="21" fill="#8B5CF6" opacity="0.16" stroke="#A78BFA"/><text x="56" y="27" text-anchor="middle" fill="#DDD6FE">COSTUME</text></g>
      <g transform="translate(258 0)"><rect width="92" height="42" rx="21" fill="#F59E0B" opacity="0.15" stroke="#FBBF24"/><text x="46" y="27" text-anchor="middle" fill="#FDE68A">SHINY</text></g>
      <g transform="translate(364 0)"><rect width="132" height="42" rx="21" fill="#10B981" opacity="0.14" stroke="#34D399"/><text x="66" y="27" text-anchor="middle" fill="#A7F3D0">EVENT DATE</text></g>
      <g transform="translate(510 0)"><rect width="115" height="42" rx="21" fill="#EC4899" opacity="0.14" stroke="#F472B6"/><text x="57.5" y="27" text-anchor="middle" fill="#FBCFE8">0–100 SCORE</text></g>
    </g>
  </g>
  <g transform="translate(100 620)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <g><rect width="205" height="86" rx="18" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.10"/><text x="20" y="34" fill="#F8FAFC" font-weight="800" font-size="26">1,011</text><text x="20" y="62" fill="#94A3B8" font-size="15">canonical species</text></g>
    <g transform="translate(221 0)"><rect width="205" height="86" rx="18" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.10"/><text x="20" y="34" fill="#F8FAFC" font-weight="800" font-size="26">4 axes</text><text x="20" y="62" fill="#94A3B8" font-size="15">capped scoring model</text></g>
    <g transform="translate(442 0)"><rect width="205" height="86" rx="18" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.10"/><text x="20" y="34" fill="#F8FAFC" font-weight="800" font-size="26">Date-aware</text><text x="20" y="62" fill="#94A3B8" font-size="15">event attribution</text></g>
  </g>
