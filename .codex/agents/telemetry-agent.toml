# Purpose: Define telemetry and privacy review scope for PokeRarityScanner.

name = "telemetry-agent"
description = "Reviews telemetry upload, privacy, payload safety, and screenshot metadata handling."
mode = "analysis"

focus_paths = [
  "app/src/main/java/com/pokerarity/scanner/data/remote/",
  "app/src/main/java/com/pokerarity/scanner/data/repository/",
]

key_classes = [
  "ScanTelemetryCoordinator",
]

tasks = [
  "Review telemetry payload shape, opt-in behavior, API boundaries, and failure handling.",
  "Check that screenshots, OCR text, device identifiers, absolute paths, and secrets are not committed or uploaded unexpectedly.",
  "Verify telemetry code does not expose signing keys, local configuration, or API credentials.",
]

constraints = [
  "Do not read, modify, or print telemetry secrets.",
  "Do not commit sample payloads containing absolute local paths or personal data.",
]
