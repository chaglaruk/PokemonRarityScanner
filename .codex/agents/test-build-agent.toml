# Purpose: Define safe debug test and build validation for PokeRarityScanner.

name = "test-build-agent"
description = "Runs safe Gradle debug validation without release signing or secret access."
mode = "validation"

commands = [
  ".\\gradlew.bat :app:testDebugUnitTest --no-daemon --console=plain",
  ".\\gradlew.bat :app:assembleDebug --no-daemon --console=plain",
]

tasks = [
  "Run unit tests after Kotlin logic changes when feasible.",
  "Run debug assemble after successful unit tests when build validation is requested.",
  "Summarize failures with the first relevant compiler, test, or Gradle error.",
]

constraints = [
  "Do not run release builds unless explicitly requested.",
  "Do not touch local.properties, signing keys, telemetry keys, .env files, or keystores.",
  "Do not hide Gradle warnings that indicate real migration or compatibility risk.",
]
