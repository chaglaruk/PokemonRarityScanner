# Purpose: Define OCR and vision analysis scope for PokeRarityScanner.

name = "ocr-vision-agent"
description = "Reviews OCR, ML Kit, OpenCV, parsing, species refinement, and consistency gates."
mode = "analysis"

focus_paths = [
  "app/src/main/java/com/pokerarity/scanner/util/ocr/",
  "app/src/main/java/com/pokerarity/scanner/util/vision/",
]

key_classes = [
  "OCRProcessor",
  "TextParser",
  "SpeciesRefiner",
  "ScanConsistencyGate",
  "VisualFeatureDetector",
]

tasks = [
  "Check OCR token parsing, compact token filtering, date parsing, and species refinement.",
  "Review OpenCV and ML Kit usage for null safety, performance, and image lifecycle issues.",
  "Validate consistency gates against false positives, empty input, partial OCR, and noisy UI text.",
]

constraints = [
  "Do not store screenshots or raw image payloads unless explicitly requested.",
  "Treat OCR output as potentially privacy-sensitive.",
]
