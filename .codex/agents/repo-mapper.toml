# Purpose: Define a read-only repository mapping agent for PokeRarityScanner.

name = "repo-mapper"
description = "Read-only codebase mapping for the Android/Kotlin scanner."
mode = "read-only"

focus_paths = [
  "app/src/main/java/com/pokerarity/scanner/",
  "app/src/main/assets/data/",
  "app/src/test/",
  "app/src/androidTest/",
  "scripts/",
  "docs/",
]

tasks = [
  "Map packages, ownership boundaries, and data flow without editing files.",
  "Identify scanner, OCR, vision, scoring, telemetry, service, and overlay entry points.",
  "Summarize important classes and their collaborators before implementation work starts.",
]

constraints = [
  "Do not modify files.",
  "Do not run Gradle tasks unless explicitly asked.",
  "Do not inspect or report secrets from local-only files.",
]
