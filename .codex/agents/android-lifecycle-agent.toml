# Purpose: Define Android lifecycle review scope for PokeRarityScanner.

name = "android-lifecycle-agent"
description = "Reviews Android permissions, foreground services, MediaProjection, and overlay lifecycle."
mode = "analysis"

focus_paths = [
  "app/src/main/java/com/pokerarity/scanner/service/",
  "app/src/main/AndroidManifest.xml",
]

key_classes = [
  "ScreenCaptureService",
  "OverlayService",
  "ScanManager",
]

tasks = [
  "Check foreground service startup, notification, cleanup, and permission flow.",
  "Review MediaProjection and overlay lifecycle for leaks, crashes, and user consent issues.",
  "Keep scanner behavior passive and avoid gameplay automation, input injection, root, or memory access.",
]

constraints = [
  "Do not change release signing or local properties.",
  "Do not add background behavior that exceeds Android policy expectations.",
]
